// Uncollected roder shown on the map: between the northern line 2114–2117 and the southern line 2002–2005.
const shownFree=['2011','2022','2025','2107','2108','2110','2111','2113','2115','2116','2117'];
const tileUrl='https://cache.kartverket.no/v1/wmts/1.0.0/topograatone/default/webmercator/{z}/{y}/{x}.png';
const attribution='© Kartverket · Roder: Stavanger kommune';
const fmtDate=d=>new Date(d+'T12:00').toLocaleDateString('nb-NO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtShort=d=>new Date(d+'T12:00').toLocaleDateString('nb-NO',{weekday:'long',day:'numeric',month:'long'});
const addDays=(d,n)=>{const t=new Date(d+'T12:00');t.setDate(t.getDate()+n);return t.toISOString().slice(0,10);};
const handoutDate=d=>{if(season.handouts[d])return season.handouts[d];const t=new Date(d+'T12:00');t.setDate(t.getDate()-14);while(t.getDay()!==1)t.setDate(t.getDate()-1);return t.toISOString().slice(0,10);};
const area=r=>r.startsWith('20')?'Sør':'Nord';
const contactText=season.contacts.map(c=>c.name+', tlf. '+c.phone).join(' · ');
const assigned=Object.keys(byRode).sort();
if(new URLSearchParams(location.search).has('ark')) renderArk(); else renderMap();

function renderArk(){
  document.body.classList.add('ark');
  document.title='Rodeark '+season.name+' – flaskeinnsamling Tasta Skolekorps';
  const dates=season.collections.map(fmtDate).join(' · ');
  const total=assigned.reduce((s,r)=>s+dwellings[r],0);
  const table=rs=>'<table><thead><tr><th>Rode</th><th>Ansvarlig</th><th>Postkasser</th></tr></thead><tbody>'+rs.map(r=>`<tr><td><b>${r}</b></td><td>${byRode[r].join('<br>')}</td><td>${dwellings[r]}</td></tr>`).join('')+'</tbody></table>';
  const half=Math.ceil(assigned.length/2);
  const schedule='<table>'+season.collections.map(d=>`<tr><td>Lapper ut:</td><td>${fmtShort(addDays(handoutDate(d),2))}, senest ${fmtShort(addDays(handoutDate(d),6))}</td></tr><tr><td><b>Innsamling:</b></td><td><b>${fmtDate(d)}</b></td></tr>`).join('')+'</table>';
  let html=`<section class="page overview"><h1>Rodefordeling ${season.name}</h1>
    <p>Tasta Skolekorps · flaskeinnsamling kl. 17–20:30 · mottak på Byfjord skole</p><p>${dates}</p>
    <div class="cols">${table(assigned.slice(0,half))}${table(assigned.slice(half))}</div>
    <p style="margin-top:auto">${assigned.length} roder · ${total} postkasser totalt · Kontakt: ${contactText} · Vipps ${season.vipps}</p></section>`;
  for(const r of assigned){
    html+=`<section class="page rode"><header><div><div class="big">Rode ${r}</div><div>${area(r)} · Tasta Skolekorps flaskeinnsamling ${season.name}</div></div><div class="names">${byRode[r].join('<br>')}</div></header>
      <div class="facts"><div><div class="count">${dwellings[r]}</div>postkasser = lapper som trengs</div>${schedule}</div>
      <div class="map" id="m${r}"></div>
      <footer>Samle inn kl. 17–20:30 og lever flasker, bokser og badgen i mottaket på Byfjord skole. Kan du ikke? Finn en erstatter. Kontakt: ${contactText} · Vipps ${season.vipps}</footer></section>`;
  }
  document.getElementById('ark').innerHTML=html;
  // Maps load one at a time with tile retries; the tile server resets connections under load.
  const next=i=>{
    if(i===assigned.length){window.arkReady=true;return;}
    const r=assigned[i];
    const m=L.map('m'+r,{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false,zoomSnap:0.25});
    L.tileLayer(tileUrl,{maxZoom:19,attribution})
      .on('tileerror',e=>{const t=e.tile,n=(t.retries||0)+1;if(n<=5){t.retries=n;setTimeout(()=>t.src=e.target.getTileUrl(e.coords)+'?r='+n,500*n);}})
      .once('load',()=>next(i+1)).addTo(m);
    const ring=polys[r];
    m.fitBounds(ring,{padding:[20,20],maxZoom:18});
    const view=m.getBounds().pad(0.1);
    for(const [o,other] of Object.entries(polys)){
      if(o===r||!view.intersects(L.latLngBounds(other))) continue;
      L.polygon(other,{color:'#666',weight:1,fill:false,dashArray:'4 4',interactive:false}).addTo(m)
        .bindTooltip(o,{permanent:true,direction:'center',className:'nlbl'});
    }
    L.polygon(ring,{color:'#1f7a4d',weight:4,fillColor:'#1f7a4d',fillOpacity:0.1,interactive:false}).addTo(m);
  };
  next(0);
}

function renderMap(){
document.getElementById('info').innerHTML=
  `<p><b>Innsamling</b> kl. 17–20:30:<br>${season.collections.map(fmtDate).join('<br>')}</p>
   <p><b>Mottak:</b> Byfjord skole</p><p><b>Kontakt:</b> ${contactText}</p><p><b>Vipps:</b> ${season.vipps}</p>
   <p><a href="index.html">Slik foregår innsamlingen</a><br><a href="rodeark-${season.name}.pdf">Rodeark (PDF)</a></p>`;
const map=L.map('map',{preferCanvas:true});
L.tileLayer(tileUrl,{maxZoom:19,attribution}).addTo(map);
const colors=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6','#bfef45','#fabed4','#469990','#dcbeff','#9A6324','#800000','#aaffc3','#808000','#ffd8b1','#000075','#a9a9a9'];
const freeLayer=L.layerGroup();
const bounds=[],layers={};let i=0;
for(const [rode,ring] of Object.entries(polys)){
  const names=byRode[rode]; const has=!!names;
  if(!has&&!shownFree.includes(rode)) continue;
  const color=has?colors[i++%colors.length]:'#777';
  const poly=L.polygon(ring,{color,weight:has?2:1.5,fillColor:color,fillOpacity:has?0.28:0.3,dashArray:has?null:'5 4'}).addTo(has?map:freeLayer);
  layers[rode]=poly;
  if(has) bounds.push(...ring);
  const c=poly.getBounds().getCenter();
  const tip=L.tooltip({permanent:true,direction:'center',className:'lbl'+(has?'':' free'),opacity:1}).setLatLng(c)
    .setContent('<b>'+rode+'</b>'+(has?names.join('<br>'):'Samles ikke inn')+'<small>'+dwellings[rode]+' postkasser</small>');
  if(has) tip.addTo(map); else tip.addTo(freeLayer);
}
map.fitBounds(bounds,{padding:[30,30]});
freeLayer.addTo(map);
document.getElementById('free').addEventListener('change',e=>e.target.checked?freeLayer.addTo(map):map.removeLayer(freeLayer));
const people=assigned.flatMap(r=>byRode[r].map(n=>[n,r])).sort((a,b)=>a[0].localeCompare(b[0],'nb'));
document.getElementById('names').innerHTML=people.map(([n,r])=>`<option value="${n}">Rode ${r}</option>`).join('');
const search=document.getElementById('search'),hit=document.getElementById('hit');
let selected=null;
const find=()=>{
  const q=search.value.trim().toLowerCase();
  if(selected){selected.setStyle({weight:2});selected=null;}
  if(q.length<2){hit.textContent='';return;}
  const matches=people.filter(([n])=>n.toLowerCase().includes(q));
  const [n,r]=matches.find(([n])=>n.toLowerCase()===q)||matches[0]||[];
  if(!r){hit.textContent='Ingen treff';return;}
  hit.textContent=`${n}: rode ${r}`+(matches.length>1?` (${matches.length} treff)`:'');
  selected=layers[r].setStyle({weight:6});
  selected.bringToFront();
  map.fitBounds(layers[r].getBounds(),{padding:[40,40],maxZoom:17});
};
search.addEventListener('change',find);
search.addEventListener('keydown',e=>{if(e.key==='Enter')find();});
}
