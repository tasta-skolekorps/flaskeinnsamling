name: CI

# Pull request checks for main. The job "build-and-test" is a required status check in the
# main ruleset, so the workflow has no paths filter and must always report.
# Deploy (deploy.yml) runs when the PR is merged to main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLUTION: Flaskeinnsamling.slnx
      ACTIONLINT_VERSION: "1.7.12"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint workflows (actionlint)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            "rhysd/actionlint:$ACTIONLINT_VERSION" \
            -color

      - name: Setup .NET (global.json)
        if: ${{ hashFiles('global.json') != '' }}
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup .NET 10
        if: ${{ hashFiles('global.json') == '' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The AppHost health-checks the API over https://localhost, so the ASP.NET Core dev cert must
      # be trusted. On Linux, --trust adds it to .NET's CurrentUser\Root store and exports it to
      # ~/.aspnet/dev-certs/trust; OpenSSL clients only see it via SSL_CERT_DIR.
      # https://learn.microsoft.com/aspnet/core/security/enforcing-ssl#linux-specific-considerations
      - name: Trust ASP.NET Core dev certificate
        run: |
          set -euo pipefail
          # Browser (NSS) trust may report a partial failure on the runner; verify the export below.
          dotnet dev-certs https --trust --verbose || echo "::warning::dotnet dev-certs https --trust reported a partial failure."
          trust_dir="$HOME/.aspnet/dev-certs/trust"
          if ! compgen -G "$trust_dir/*" > /dev/null; then
            echo "::error::No exported dev certificate in $trust_dir."
            exit 1
          fi
          openssl_dir=$(openssl version -d | sed -E 's/^OPENSSLDIR: "(.*)"$/\1/')
          ssl_cert_dir="$trust_dir:$openssl_dir/certs"
          echo "SSL_CERT_DIR=$ssl_cert_dir" >> "$GITHUB_ENV"
          SSL_CERT_DIR="$ssl_cert_dir" dotnet dev-certs https --check --trust || echo "::warning::dev cert trust check did not report full trust."

      - name: Build
        run: dotnet build "$SOLUTION" -c Release

      # Integration tests start the AppHost via Aspire.Hosting.Testing; DCP ships with the
      # Aspire.Hosting packages and Azurite runs in Docker (preinstalled on ubuntu-latest).
      - name: Test
        timeout-minutes: 20
        run: |
          dotnet test "$SOLUTION" -c Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory "$RUNNER_TEMP/test-results"

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 7
