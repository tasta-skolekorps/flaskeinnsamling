name: CI

# Pull request checks for main. The job "build-and-test" is a required status check in the
# main ruleset, so the workflow has no paths filter and must always report.
# Deploy (deploy.yml) runs when the PR is merged to main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLUTION: Flaskeinnsamling.slnx
      ACTIONLINT_VERSION: "1.7.12"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint workflows (actionlint)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            "rhysd/actionlint:$ACTIONLINT_VERSION" \
            -color

      - name: Setup .NET (global.json)
        if: ${{ hashFiles('global.json') != '' }}
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup .NET 10
        if: ${{ hashFiles('global.json') == '' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build "$SOLUTION" -c Release

      # Integration tests start the AppHost via Aspire.Hosting.Testing; DCP ships with the
      # Aspire.Hosting packages and Azurite runs in Docker (preinstalled on ubuntu-latest).
      - name: Test
        timeout-minutes: 20
        run: |
          dotnet test "$SOLUTION" -c Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory "$RUNNER_TEMP/test-results"

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 7
